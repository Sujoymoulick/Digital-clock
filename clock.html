<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Interactive Digital Clock</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-900 text-green-400">

  <div id="three-container"></div>

  <div class="clock-overlay p-4">

    <div class="w-full h-full relative flex flex-col items-center justify-center">

      <button onclick="window.history.back()"
        class="absolute top-4 left-4 p-3 bg-gray-800/70 text-green-400 hover:bg-gray-700/80 transition duration-150 rounded-full shadow-lg focus:outline-none focus:ring-2 focus:ring-green-500/50 z-20"
        aria-label="Go back to the previous page">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
          <path d="M19 12H5"></path>
          <path d="M12 19L5 12 12 5"></path>
        </svg>
      </button>

      <a href="https://github.com/your-username/digital-clock" target="_blank"
        class="absolute top-4 right-4 p-3 bg-green-700/70 text-white hover:bg-green-600/80 transition duration-150 rounded-full shadow-lg focus:outline-none focus:ring-2 focus:ring-green-400 z-20"
        aria-label="View this project on GitHub">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.805 8.207 11.387.6.111.828-.261.828-.579 0-.288-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.542-1.361-1.325-1.725-1.325-1.725-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.237 1.838 1.237 1.07 1.835 2.809 1.305 3.492.997.108-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.467-2.381 1.236-3.221-.124-.303-.535-1.516.117-3.176 0 0 1-.322 3.297 1.238.966-.269 1.986-.403 3-.408 1.014.005 2.034.139 3 .408 2.296-1.56 3.297-1.238 3.297-1.238.652 1.66.241 2.873.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.923.43.372.823 1.102.823 2.222 0 1.604-.015 2.899-.015 3.286 0 .315.215.694.832.578C20.565 21.8 24 17.3 24 12c0-6.627-5.373-12-12-12z" />
        </svg>
      </a>

      <div id="time-display" class="text-6xl sm:text-8xl lg:text-9xl font-bold tracking-wider digital-glow">
        --:--:--
      </div>

      <div id="ampm-indicator" class="mt-4 text-3xl sm:text-4xl lg:text-5xl font-medium digital-glow">
        --
      </div>

      <div id="date-display" class="mt-8 text-lg sm:text-xl lg:text-2xl text-gray-400 font-light tracking-wide">
        --
      </div>

      <div id="timezone-info" class="mt-2 text-sm text-gray-500">
        Local Time
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
